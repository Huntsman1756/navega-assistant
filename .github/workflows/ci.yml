name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version is read from package.json "packageManager" (pnpm@10.33.3)

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + integration tests
        run: pnpm -r test

      - name: Build
        run: pnpm build

      - name: Security checks (bundle + permissions)
        run: pnpm security:check

      - name: Git history secret scan
        run: pnpm security:git-history

      - name: Install Playwright browsers
        run: pnpm --filter @guided-web/extension exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e
