<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictado de voz — Navega</title>
    <style>
      :root {
        --fg: #1c1c1c;
        --bg: #ffffff;
        --muted: #6b6b6b;
        --accent: #2563eb;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f3f3f3;
          --bg: #1b1b1b;
          --muted: #9a9a9a;
          --accent: #7aa2ff;
          --danger: #f87171;
        }
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 24px;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
        max-width: 360px;
      }
      button {
        padding: 14px 28px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        min-width: 200px;
      }
      button.recording {
        background: var(--danger);
        animation: pulse 1.5s infinite;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        font-size: 0.9rem;
        color: var(--muted);
        min-height: 1.4em;
        text-align: center;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .mic-icon {
        font-size: 2.5rem;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="mic-icon">🎙</div>
    <h1>Dictado de voz — Navega</h1>
    <p>
      Permite el acceso al micrófono para dictar tu pregunta.
      Tu voz se transcribirá y se enviará al asistente.
    </p>
    <button id="mic-btn">Permitir y grabar</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="./dictation.js" defer></script>
  </body>
</html>
