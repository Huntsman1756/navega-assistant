<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pago</title>
  </head>
  <body>
    <h1>Pasarela de pago</h1>
    <p>Para completar tu compra, revisa el importe antes de confirmar.</p>
    <label for="cc">Número de tarjeta</label>
    <input id="cc" type="text" autocomplete="cc-number" placeholder="1234 5678 9012 3456" />
    <button id="pay" type="button">Pagar 49,99</button>
    <input id="otp" type="text" autocomplete="one-time-code" value="000000" />
  </body>
</html>
